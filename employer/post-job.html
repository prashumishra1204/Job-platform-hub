<!DOCTYPE html>
<html><head><title>Post a Job - JobHub</title><link rel="stylesheet" href="../css/style.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div>
<div class="nav-menu"><a href="../index.html">Home</a><a href="../jobs.html">Jobs</a><a href="dashboard.html">Dashboard</a><a href="post-job.html" class="active">Post Job</a><div id="user-menu"><span id="user-name"></span><a href="#" id="logout-btn">Logout</a></div></div></div></nav>
<div class="form-container"><h2>Post a New Job</h2><form id="post-job-form"><div class="form-group"><label>Job Title</label><input type="text" id="title" required></div>
<div class="form-group"><label>Company Name</label><input type="text" id="company" required></div><div class="form-group"><label>Location</label><input type="text" id="location" required></div>
<div class="form-group"><label>Job Type</label><select id="type"><option>Full-time</option><option>Part-time</option><option>Remote</option><option>Contract</option></select></div>
<div class="form-group"><label>Salary Range</label><input type="text" id="salary" placeholder="e.g., $80k - $100k" required></div>
<div class="form-group"><label>Description</label><textarea id="description" rows="5" required></textarea></div>
<div class="form-group"><label>Requirements (comma-separated)</label><input type="text" id="requirements" required></div>
<button type="submit" class="btn-submit">Post Job</button></form></div>
<script src="../js/data.js"></script><script src="../js/auth.js"></script>
<script>Auth.init(); if(!Auth.currentUser||(Auth.currentUser.role!=='employer'&&Auth.currentUser.role!=='recruiter'))window.location.href='../login.html';
document.getElementById('post-job-form').addEventListener('submit',(e)=>{e.preventDefault(); const job={title:document.getElementById('title').value,company:document.getElementById('company').value,location:document.getElementById('location').value,type:document.getElementById('type').value,salary:document.getElementById('salary').value,description:document.getElementById('description').value,requirements:document.getElementById('requirements').value.split(',').map(r=>r.trim()),employerId:Auth.currentUser.id,postedBy:Auth.currentUser.role}; Database.addJob(job); alert('Job posted successfully!'); window.location.href='dashboard.html';});</script></body></html>
