<!DOCTYPE html>
<html><head><title>My Profile - JobHub</title><link rel="stylesheet" href="../css/style.css"></head>
<body><nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div>
<div class="nav-menu"><a href="../index.html">Home</a><a href="../jobs.html">Jobs</a><a href="dashboard.html">Dashboard</a><a href="profile.html" class="active">Profile</a><div id="user-menu"><span id="user-name"></span><a href="#" id="logout-btn">Logout</a></div></div></div></nav>
<div class="form-container"><h2>My Profile</h2><form id="profile-form"><div class="form-group"><label>Name</label><input type="text" id="name" required></div><div class="form-group"><label>Email</label><input type="email" id="email" disabled></div><div class="form-group"><label>Phone</label><input type="tel" id="phone"></div><div class="form-group"><label>Location</label><input type="text" id="location"></div><div class="form-group"><label>Skills (comma-separated)</label><input type="text" id="skills"></div><button type="submit" class="btn-submit">Update Profile</button></form></div>
<script src="../js/data.js"></script><script src="../js/auth.js"></script>
<script>Auth.init(); if(!Auth.currentUser||Auth.currentUser.role!=='employee')window.location.href='../login.html'; const u=Auth.currentUser; document.getElementById('name').value=u.name||''; document.getElementById('email').value=u.email||''; document.getElementById('phone').value=u.phone||''; document.getElementById('location').value=u.location||''; document.getElementById('skills').value=(u.skills||[]).join(', '); document.getElementById('profile-form').addEventListener('submit',(e)=>{e.preventDefault(); u.name=document.getElementById('name').value; u.phone=document.getElementById('phone').value; u.location=document.getElementById('location').value; u.skills=document.getElementById('skills').value.split(',').map(s=>s.trim()); Database.save(); localStorage.setItem('currentUser',JSON.stringify(u)); alert('Profile updated!'); });</script></body></html>
