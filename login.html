<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JobHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div></div></nav>
    <div class="form-container">
        <h2>Login to Your Account</h2>
        <form id="login-form">
            <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <button type="submit" class="btn-submit">Login</button>
        </form>
        <p style="text-align:center;margin-top:20px">Don't have an account? <a href="register.html">Register here</a></p>
        <hr style="margin:20px 0">
        <h4 style="text-align:center;color:#666">Demo Accounts</h4>
        <div style="font-size:14px;background:#f5f5f5;padding:15px;border-radius:8px">
            <p><strong>👑 Admin:</strong> admin@jobhub.com / admin123</p>
            <p><strong>💼 Employee:</strong> prashumishra714@gmail.com / 123456</p>
            <p><strong>🏢 Employer:</strong> employer@jhasons.com / 123456</p>
            <p><strong>🤝 Recruiter:</strong> recruiter@techagency.com / 123456</p>
        </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            try {
                Auth.login(document.getElementById('email').value, document.getElementById('password').value);
                window.location.href = 'dashboard.html';
            } catch(err) { alert(err.message); }
        });
    </script>
</body>
</html>
