<!DOCTYPE html>
<html><head><title>My Clients - JobHub</title><link rel="stylesheet" href="../css/style.css"></head>
<body><nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div>
<div class="nav-menu"><a href="../index.html">Home</a><a href="../jobs.html">Jobs</a><a href="dashboard.html">Dashboard</a><a href="my-clients.html" class="active">Clients</a><div id="user-menu"><span id="user-name"></span><a href="#" id="logout-btn">Logout</a></div></div></div></nav>
<div class="container" style="padding:40px 20px"><h1>🏢 Client Companies</h1><div id="clients-list" class="jobs-grid"></div></div>
<script src="../js/data.js"></script><script src="../js/auth.js"></script>
<script>Auth.init(); if(!Auth.currentUser||Auth.currentUser.role!=='recruiter')window.location.href='../login.html'; const jobs=Database.getEmployerJobs(Auth.currentUser.id); const clients=[...new Set(jobs.map(j=>j.company))]; const c=document.getElementById('clients-list'); if(clients.length===0)c.innerHTML='<p>No clients added yet.</p>'; else c.innerHTML=clients.map(cl=>`<div class="job-card"><h3>${cl}</h3><div>Jobs posted: ${jobs.filter(j=>j.company===cl).length}</div><button class="btn-apply" onclick="alert('Contact client: ${cl}')">Contact</button></div>`).join('');</script></body></html>
