<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Browse Jobs - JobHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div>
    <div class="nav-menu"><a href="index.html">Home</a><a href="jobs.html" class="active">Browse Jobs</a><a href="dashboard.html">Dashboard</a><a href="employer/post-job.html">Post a Job</a>
    <div id="auth-buttons"><a href="login.html" class="btn-login">Login</a><a href="register.html" class="btn-register">Register</a></div>
    <div id="user-menu" style="display:none;"><div class="user-dropdown"><span id="user-name"></span><i class="fas fa-chevron-down"></i><div class="dropdown-content"><a href="dashboard.html">Dashboard</a><a href="#" id="logout-btn">Logout</a></div></div></div></div></div></nav>
    <div class="container" style="padding:40px 20px"><h1>Browse All Jobs</h1>
    <div class="search-box" style="margin:20px 0"><input type="text" id="filter-keyword" placeholder="Job title or company"><input type="text" id="filter-location" placeholder="Location">
    <select id="filter-type"><option value="">All Types</option><option value="Full-time">Full-time</option><option value="Part-time">Part-time</option><option value="Remote">Remote</option></select>
    <button onclick="filterJobs()"><i class="fas fa-search"></i> Filter</button></div>
    <div class="jobs-grid" id="jobs-list"></div></div>
    <footer><div class="container"><div class="footer-content"><div class="footer-section"><h4>JobHub</h4><p>Your trusted platform</p></div></div><div class="footer-bottom"><p>&copy; 2024 JobHub</p></div></div></footer>
    <script src="js/data.js"></script><script src="js/auth.js"></script>
    <script>
        function displayJobs(jobs){const c=document.getElementById('jobs-list');if(!c)return;if(jobs.length===0){c.innerHTML='<p>No jobs found.</p>';return;}
        c.innerHTML=jobs.map(j=>`<div class="job-card"><h3>${j.title}</h3><div>${j.company}</div><div>${j.location}</div><div>${j.salary}</div><button onclick="applyForJob(${j.id})" class="btn-apply">Apply Now</button></div>`).join('');}
        function filterJobs(){const k=document.getElementById('filter-keyword')?.value||'',l=document.getElementById('filter-location')?.value||'',t=document.getElementById('filter-type')?.value||'';displayJobs(Database.getJobs({keyword:k,location:l,type:t}));}
        function applyForJob(jobId){if(!Auth.isAuthenticated()){alert('Please login to apply!');window.location.href='login.html';return;}
        try{Database.applyForJob(Auth.currentUser.id,jobId);alert('Application submitted!');}catch(e){alert(e.message);}}
        displayJobs(Database.getJobs());
    </script>
</body>
</html>
