<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - JobHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar"><div class="container"><div class="nav-brand"><i class="fas fa-briefcase"></i><span>JobHub</span></div></div></nav>
    <div class="form-container">
        <h2>Create Account</h2>
        <form id="register-form">
            <div class="form-group"><label>Full Name / Company Name</label><input type="text" id="name" required></div>
            <div class="form-group"><label>Email</label><input type="email" id="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" required></div>
            <div class="form-group">
                <label>I am a:</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="employee">💼 Job Seeker (Employee)</option>
                    <option value="employer">🏢 Employer</option>
                    <option value="recruiter">🤝 Recruiter / Agency</option>
                    <option value="admin">👑 Admin (Platform Manager)</option>
                </select>
            </div>
            <div class="form-group" id="company-group" style="display:none"><label>Company / Agency Name</label><input type="text" id="company"></div>
            <button type="submit" class="btn-submit">Register</button>
        </form>
        <p style="text-align:center;margin-top:20px">Already have an account? <a href="login.html">Login here</a></p>
    </div>
    <script>
        document.getElementById('role').addEventListener('change', (e) => {
            const companyGroup = document.getElementById('company-group');
            companyGroup.style.display = (e.target.value === 'employer' || e.target.value === 'recruiter') ? 'block' : 'none';
        });
    </script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            if (!role) { alert('Please select a role'); return; }
            const userData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: role,
                company: document.getElementById('company').value || '',
                createdAt: new Date().toISOString()
            };
            try { Auth.register(userData); alert('Registration successful!'); window.location.href = 'dashboard.html'; } 
            catch(err) { alert(err.message); }
        });
    </script>
</body>
</html>
